<script>
/****************************************************
 * RAAGASREE ONLINE ASSESSMENT
 * ADMIN LOGIN CONNECTION
 ****************************************************/

const ASSESSMENT_API_URL =
  "https://script.google.com/macros/s/AKfycbyzutEAMnW_97VZpPvGqKGiZa3psQHwUE_AB3Yxvby1f0l6APEE7gWnGMt20wGkHIGs/exec";

const pageTitles = {
  dashboard: "Dashboard",
  students: "Student Management",
  subjects: "Subject Management",
  questions: "Question Bank",
  exams: "Exam Management",
  results: "Examination Results",
  verification: "Verification Logs",
  settings: "System Settings"
};


/****************************************************
 * ADMIN LOGIN
 ****************************************************/

async function adminLogin() {
  const pin = document.getElementById("adminPin").value.trim();
  const message = document.getElementById("loginMessage");
  const button = document.querySelector(".login-card .primary-btn");

  if (!/^\d{6}$/.test(pin)) {
    message.textContent = "Please enter your complete 6-digit PIN.";
    return;
  }

  message.style.color = "#7c8798";
  message.textContent = "Verifying administrator PIN...";

  button.disabled = true;
  button.textContent = "Please wait...";

  try {
    const response = await fetch(ASSESSMENT_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "adminLogin",
        pin: pin
      })
    });

    if (!response.ok) {
      throw new Error("Server returned an error.");
    }

    const result = await response.json();

    if (result.success && result.token) {
      sessionStorage.setItem(
        "RAAGASREE_ADMIN_TOKEN",
        result.token
      );

      message.textContent = "";

      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminApp").style.display = "block";

      document.getElementById("connectionStatus").textContent =
        "Connected";

      showPage("dashboard");

    } else {
      message.style.color = "#d9534f";
      message.textContent =
        result.message || "Administrator login failed.";
    }

  } catch (error) {
    console.error("Admin login error:", error);

    message.style.color = "#d9534f";
    message.textContent =
      "Unable to connect to the backend. Please check the deployment and try again.";

  } finally {
    button.disabled = false;
    button.textContent = "Continue to Dashboard";
  }
}


/****************************************************
 * LOGOUT
 ****************************************************/

function logout() {
  sessionStorage.removeItem("RAAGASREE_ADMIN_TOKEN");

  document.getElementById("adminApp").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("adminPin").value = "";
  document.getElementById("loginMessage").textContent = "";
}


/****************************************************
 * PAGE NAVIGATION
 ****************************************************/

function showPage(name) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.querySelectorAll(".nav-btn[data-page]").forEach(button => {
    button.classList.remove("active");
  });

  const page = document.getElementById("page-" + name);

  if (page) {
    page.classList.add("active");
  }

  const nav = document.querySelector(
    '.nav-btn[data-page="' + name + '"]'
  );

  if (nav) {
    nav.classList.add("active");
  }

  document.getElementById("topTitle").textContent =
    pageTitles[name] || "Dashboard";

  document.getElementById("sidebar").classList.remove("open");
}


/****************************************************
 * NAVIGATION BUTTONS
 ****************************************************/

document.querySelectorAll(".nav-btn[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});


/****************************************************
 * MOBILE SIDEBAR
 ****************************************************/

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}


/****************************************************
 * FORM DISPLAY
 ****************************************************/

function showForm(id) {
  document.getElementById(id).style.display = "block";

  document.getElementById(id).scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function hideForm(id) {
  document.getElementById(id).style.display = "none";
}


/****************************************************
 * DATABASE PLACEHOLDER
 ****************************************************/

function notConnected() {
  alert(
    "This feature is not connected yet. " +
    "The backend functions will be added next."
  );
}


/****************************************************
 * ENTER KEY LOGIN
 ****************************************************/

document.getElementById("adminPin").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    adminLogin();
  }
});

</script>
